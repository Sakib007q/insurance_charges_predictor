<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance Charge Predictor</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl p-8">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-slate-800">Health Insurance Charge Predictor</h1>
      <p class="text-slate-500 text-sm mt-1">Estimate a customer's expected medical charges</p>
    </div>

    {% if not available %}
    <div class="mb-6 p-4 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-sm">
      No trained model files were found in <code>models/</code>. Add the .pkl files
      (e.g. <code>random_forest_model.pkl</code>) from the notebook and redeploy.
    </div>
    {% endif %}

    <form id="predict-form" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Age</label>
          <input type="number" name="age" min="0" max="120" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Sex</label>
          <select name="sex" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">BMI</label>
          <input type="number" step="0.1" name="bmi" min="0" max="80" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Children</label>
          <input type="number" name="children" min="0" max="10" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Smoker</label>
          <select name="smoker" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Region</label>
          <select name="region" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            {% for r in regions %}
            <option value="{{ r }}">{{ r.replace('_',' ').title() }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Model</label>
        <select name="model" id="model-select" required
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
          {% for key, label in models.items() %}
          <option value="{{ key }}" {% if key not in available %}disabled{% endif %}>
            {{ label }}{% if key not in available %} (unavailable){% endif %}
          </option>
          {% endfor %}
        </select>
      </div>

      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
        Predict Charges
      </button>
    </form>

    <div id="result" class="mt-6 hidden">
      <div class="p-4 rounded-lg bg-indigo-50 border border-indigo-200 text-center">
        <p class="text-sm text-slate-500" id="result-model"></p>
        <p class="text-3xl font-bold text-indigo-700 mt-1" id="result-value"></p>
        <p class="text-xs text-slate-400 mt-2" id="result-r2"></p>
      </div>
    </div>

    <div id="error" class="mt-6 hidden">
      <div class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm" id="error-text"></div>
    </div>
  </div>

<script>
const form = document.getElementById('predict-form');
const resultBox = document.getElementById('result');
const errorBox = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  resultBox.classList.add('hidden');
  errorBox.classList.add('hidden');

  const formData = new FormData(form);
  const payload = Object.fromEntries(formData.entries());

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!res.ok) {
      document.getElementById('error-text').textContent = data.error || 'Something went wrong.';
      errorBox.classList.remove('hidden');
      return;
    }

    document.getElementById('result-model').textContent = `Prediction (${data.model})`;
    document.getElementById('result-value').textContent = `$${data.prediction.toLocaleString()}`;
    document.getElementById('result-r2').textContent = data.r2 != null
      ? `Model test R² score: ${data.r2}`
      : '';
    resultBox.classList.remove('hidden');
  } catch (err) {
    document.getElementById('error-text').textContent = 'Network error — please try again.';
    errorBox.classList.remove('hidden');
  }
});
</script>
</body>
</html>
